<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Romon AI - Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #131314; color: #e3e3e3; height: 100vh; display: flex; flex-direction: column; font-family: 'Segoe UI', sans-serif; margin: 0; overflow: hidden; }
        .navbar { background-color: #131314; border-bottom: 1px solid #2b2c2f; padding: 10px 0; }
        .nav-container { display: flex; align-items: center; width: 100%; padding: 0 15px; }
        .navbar-toggler { border: none !important; padding: 0 !important; outline: none !important; box-shadow: none !important; margin-right: 15px; color: white; font-size: 20px; background: transparent; }
        .navbar-brand { font-weight: bold; font-size: 1.25rem; margin-right: auto; color: white !important; text-decoration: none; }
        .offcanvas { background-color: #1e1f20 !important; color: #e3e3e3; width: 280px !important; border-right: 1px solid #444; }
        .new-chat-btn { background: #2b2c2f; border: 1px solid #444; border-radius: 25px; padding: 12px; text-align: center; cursor: pointer; margin: 15px 0; color: #fff; font-weight: 500; }
        .new-chat-btn:hover { background: #37393b; color: #4285f4; }
        .history-section { flex-grow: 1; overflow-y: auto; margin-top: 10px; max-height: 250px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 5px; transition: 0.2s; background: rgba(255,255,255,0.03); }
        .history-item:hover { background: #2b2c2f; }
        .history-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; width: 85%; color: #ccc; }
        .history-delete { color: #666; transition: 0.3s; padding: 5px; cursor: pointer; }
        .history-delete:hover { color: #ff4d4d; }
        .ai-link { display: flex; align-items: center; padding: 10px; border-radius: 8px; text-decoration: none !important; color: #ccc !important; margin-bottom: 2px; }
        .ai-link:hover { background: #2b2c2f; }
        .dot { height: 10px; width: 10px; border-radius: 50%; display: inline-block; margin-right: 12px; }
        .lang-toggle-container { background: #2b2c2f; border-radius: 10px; padding: 10px; margin-bottom: 20px; }
        .lang-btn-group { display: flex; gap: 10px; }
        .lang-btn { flex: 1; border: none; background: #37393b; color: #888; padding: 5px; border-radius: 5px; font-size: 13px; cursor: pointer; }
        .lang-btn.active { background: #4285f4; color: white; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; max-width: 900px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; }
        .user-message-wrapper { align-self: flex-end; max-width: 85%; background-color: #2b2c2f; padding: 12px 20px; border-radius: 20px; margin-bottom: 25px; color: white; white-space: pre-wrap; }
        .ai-message-wrapper { align-self: flex-start; width: 100%; margin-bottom: 35px; }
        .ai-name { font-weight: bold; margin-bottom: 10px; display: block; font-size: 15px; }
        .spinner-box { display: flex; align-items: center; gap: 10px; font-size: 14px; color: #888; }
        .colorful-spinner { width: 18px; height: 18px; border: 3px solid #333; border-top: 3px solid #4285f4; border-radius: 50%; animation: spin 0.8s linear infinite, spinColor 2s linear infinite; }
        @keyframes spinColor { 0% { border-top-color: #4285f4; } 33% { border-top-color: #34a853; } 66% { border-top-color: #fbbc04; } 100% { border-top-color: #ea4335; } }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .input-area { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; background: #131314; }
        .input-box-wrapper { background-color: #1e1f20; border-radius: 25px; padding: 5px 20px; display: flex; align-items: flex-end; border: 1px solid #444; }
        .input-box-wrapper textarea { background: transparent; border: none; color: white; outline: none; width: 100%; padding: 10px; font-size: 16px; resize: none; max-height: 150px; overflow-y: auto; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark">
        <div class="nav-container">
            <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarMenu"><i class="fas fa-bars"></i></button>
            <a class="navbar-brand" href="#">Romon AI</a>
            <button class="btn btn-outline-light btn-sm rounded-pill px-3" id="loginBtn" onclick="toggleLogin()">Login</button>
        </div>
    </nav>

    <div class="offcanvas offcanvas-start" id="sidebarMenu">
        <div class="offcanvas-header border-bottom border-secondary">
            <h5 class="offcanvas-title">Romon AI Exploration</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column">
            <label class="text-secondary small mb-2" id="langLabel">CHOOSE LANGUAGE</label>
            <div class="lang-toggle-container">
                <div class="lang-btn-group">
                    <button class="lang-btn active" id="btnEn" onclick="setLang('en')">English</button>
                    <button class="lang-btn" id="btnBn" onclick="setLang('bn')">বাংলা</button>
                </div>
            </div>
            <label class="text-secondary small mb-1" id="historyLabel">CHAT HISTORY</label>
            <div class="history-section" id="historyList"></div>
            <div class="new-chat-btn" onclick="createNewChat()" id="newChatBtn">+ Create New Chat</div>
            <hr>
            <label class="text-secondary small mb-2" id="aiLabel">SELECT AI MODEL</label>
            <nav class="nav flex-column mb-4" id="ai-list">
                <a class="ai-link" href="#" onclick="selectAI('Romon AI', 'clr-romon')"><span class="dot bg-light"></span>Romon AI</a>
                <a class="ai-link" href="#" onclick="selectAI('Gemini 2.0', 'clr-gemini')"><span class="dot bg-primary"></span>Gemini 2.0</a>
                <a class="ai-link" href="#" onclick="selectAI('ChatGPT-4o', 'clr-chatgpt')"><span class="dot bg-success"></span>ChatGPT-4o</a>
                <a class="ai-link" href="#" onclick="selectAI('Claude 3.5', 'clr-claude')"><span class="dot" style="background: #d97757;"></span>Claude 3.5</a>
                <a class="ai-link" href="#" onclick="selectAI('Llama 3.3', 'clr-llama')"><span class="dot" style="background: #0668E1;"></span>Llama 3.3 Meta</a>
                <a class="ai-link" href="#" onclick="selectAI('DeepSeek R1', 'clr-deepseek')"><span class="dot" style="background: #60a5fa;"></span>DeepSeek R1</a>
                <a class="ai-link" href="#" onclick="selectAI('Mistral Large', 'clr-mistral')"><span class="dot" style="background: #f3d43d;"></span>Mistral Large</a>
            </nav>
        </div>
    </div>

    <div id="chat-container">
        <div class="mt-5 text-center" id="welcome-section">
            <h2 id="welcome-msg" style="color: #c4c7c5; font-weight: 500;"></h2>
            <p class="text-secondary" id="welcome-sub"></p>
        </div>
    </div>

    <div class="input-area">
        <div class="input-box-wrapper">
            <textarea id="user-msg" placeholder="Type your message..." rows="1" oninput="autoHeight(this)"></textarea>
            <button class="btn text-primary fw-bold pb-2" onclick="handleSend()"><i class="fas fa-paper-plane fa-lg"></i></button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        let currentAI = "Romon AI", currentAIColor = "clr-romon", currentLang = 'en';
        let isLoggedIn = false, userName = "Imran", currentChatId = null;
        let memory = [{ role: "system", content: "You are Romon AI. Always respond in Bengali." }];
        
        const STORAGE_KEY = 'romon_pro_storage_v5';
        let chatHistory = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
        
        const API_KEY = "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";

        const dictionary = {
            en: { hello: "Hello", iam: "I am", welcome_sub: "How can I help you today?", new_chat: "+ Create New Chat", history: "CHAT HISTORY", select_ai: "SELECT AI MODEL", lang_label: "CHOOSE LANGUAGE", placeholder: "Type your message...", thinking: "Thinking..." },
            bn: { hello: "হ্যালো", iam: "আমি হই", welcome_sub: "আজ আমি আপনাকে কীভাবে সাহায্য করতে পারি?", new_chat: "+ নতুন চ্যাট শুরু করুন", history: "পুরানো চ্যাট তালিকা", select_ai: "AI মডেল নির্বাচন করুন", lang_label: "ভাষা পরিবর্তন করুন", placeholder: "আপনার প্রশ্ন লিখুন...", thinking: "চিন্তা করছি..." }
        };

        function autoHeight(el) { el.style.height = "auto"; el.style.height = (el.scrollHeight) + "px"; }

        function setLang(lang) {
            currentLang = lang;
            document.getElementById('btnEn').classList.toggle('active', lang === 'en');
            document.getElementById('btnBn').classList.toggle('active', lang === 'bn');
            const t = dictionary[lang];
            document.getElementById('langLabel').innerText = t.lang_label;
            document.getElementById('historyLabel').innerText = t.history;
            document.getElementById('newChatBtn').innerText = t.new_chat;
            document.getElementById('aiLabel').innerText = t.select_ai;
            document.getElementById('user-msg').placeholder = t.placeholder;
            document.getElementById('welcome-sub').innerText = t.welcome_sub;
            updateWelcomeName();
        }

        function toggleLogin() {
            isLoggedIn = !isLoggedIn;
            document.getElementById('loginBtn').innerText = isLoggedIn ? "Logout" : "Login";
            updateWelcomeName();
        }

        function updateWelcomeName() {
            const welcomeMsg = document.getElementById('welcome-msg');
            if(!welcomeMsg) return;
            const t = dictionary[currentLang];
            welcomeMsg.innerHTML = `${t.hello}${isLoggedIn ? ', '+userName : ''}, <br> ${t.iam} <span class="${currentAIColor}">${currentAI}</span>.`;
        }

        function selectAI(name, color) {
            currentAI = name; currentAIColor = color; updateWelcomeName();
            const instance = bootstrap.Offcanvas.getInstance(document.getElementById('sidebarMenu'));
            if(instance) instance.hide();
        }

        function renderHistory() {
            const list = document.getElementById('historyList');
            if(!list) return;
            list.innerHTML = "";
            chatHistory.forEach((chat) => {
                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `<div class="history-text" onclick="loadChat('${chat.id}')"><i class="far fa-message me-2"></i>${chat.title}</div><i class="fas fa-trash-can history-delete" onclick="deleteHistory(event, '${chat.id}')"></i>`;
                list.appendChild(div);
            });
        }

        function saveMessageToHistory(role, text) {
            if (!currentChatId) {
                currentChatId = 'chat_' + Date.now();
                let title = text.length > 30 ? text.substring(0, 30) + "..." : text;
                chatHistory.unshift({ id: currentChatId, title: title, messages: [], aiModel: currentAI, aiColor: currentAIColor });
            }
            const chat = chatHistory.find(c => c.id === currentChatId);
            if (chat) {
                chat.messages.push({ role, text });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
                renderHistory();
            }
        }

        function loadChat(id) {
            const chat = chatHistory.find(c => c.id === id);
            if (!chat) return;
            currentChatId = id;
            const container = document.getElementById('chat-container');
            container.innerHTML = "";
            memory = [{ role: "system", content: "You are Romon AI. Always respond in Bengali." }];
            if(document.getElementById('welcome-section')) document.getElementById('welcome-section').style.display = 'none';
            chat.messages.forEach(msg => {
                memory.push({ role: msg.role === 'user' ? 'user' : 'assistant', content: msg.text });
                if (msg.role === 'user') {
                    container.innerHTML += `<div class="user-message-wrapper">${msg.text}</div>`;
                } else {
                    container.innerHTML += `<div class="ai-message-wrapper"><span class="ai-name ${currentAIColor}">${currentAI}</span><div class="ai-content">${marked.parse(msg.text)}</div></div>`;
                }
            });
            container.scrollTop = container.scrollHeight;
        }

        function deleteHistory(event, id) {
            event.stopPropagation();
            chatHistory = chatHistory.filter(c => c.id !== id);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(chatHistory));
            if (currentChatId === id) createNewChat();
            renderHistory();
        }

        async function handleSend() {
            const input = document.getElementById('user-msg');
            const msg = input.value.trim();
            if (!msg) return;

            if(document.getElementById('welcome-section')) document.getElementById('welcome-section').style.display = 'none';
            const chatContainer = document.getElementById('chat-container');
            chatContainer.innerHTML += `<div class="user-message-wrapper">${msg}</div>`;
            memory.push({ role: "user", content: msg });
            saveMessageToHistory('user', msg);
            input.value = ""; input.style.height = "auto";
            
            const aiId = "ai-" + Date.now();
            chatContainer.innerHTML += `
                <div class="ai-message-wrapper">
                    <span class="ai-name ${currentAIColor}">${currentAI}</span>
                    <div class="ai-content" id="${aiId}">
                        <div class="spinner-box">
                            <div class="colorful-spinner"></div>
                            <span>${dictionary[currentLang].thinking}</span>
                        </div>
                    </div>
                </div>`;
            chatContainer.scrollTop = chatContainer.scrollHeight;

            try {
                const response = await fetch("https://models.inference.ai.azure.com/chat/completions", {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': 'Bearer ' + API_KEY
                    },
                    body: JSON.stringify({ model: "gpt-4o", messages: memory })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    document.getElementById(aiId).innerText = "GitHub Error: " + (errorData.message || JSON.stringify(errorData));
                    return;
                }

                const data = await response.json();
                const text = data.choices[0].message.content;
                memory.push({ role: "assistant", content: text });
                saveMessageToHistory('ai', text);
                const aiDiv = document.getElementById(aiId);
                aiDiv.innerHTML = "";
                typeAnimation(aiDiv, text);
            } catch (e) { 
                document.getElementById(aiId).innerText = "Connection Error: " + e.message; 
            }
        }

        function typeAnimation(element, text) {
            let i = 0;
            function type() {
                if (i < text.length) {
                    element.innerHTML = marked.parse(text.substring(0, i + 1));
                    i++; setTimeout(type, 5);
                    document.getElementById('chat-container').scrollTop = document.getElementById('chat-container').scrollHeight;
                }
            }
            type();
        }

        function createNewChat() {
            currentChatId = null;
            memory = [{ role: "system", content: "You are Romon AI. Always respond in Bengali." }];
            document.getElementById('chat-container').innerHTML = `
                <div class="mt-5 text-center" id="welcome-section">
                    <h2 id="welcome-msg" style="color: #c4c7c5; font-weight: 500;"></h2>
                    <p class="text-secondary" id="welcome-sub"></p>
                </div>`;
            setLang(currentLang);
        }

        window.onload = () => { setLang('en'); renderHistory(); };
    </script>
</body>
</html>
